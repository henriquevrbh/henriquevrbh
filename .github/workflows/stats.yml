name: Update GitHub Stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
 
concurrency:
  group: update-github-stats
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true&include_all_commits=true&count_private=true&hide_rank=true&hide=prs,issues
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=github_dark&hide_border=true&langs_count=5&count_private=true
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
      - name: Commit and push updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update GitHub stats" || { echo "Nothing to commit."; exit 0; }
 
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push attempt $i rejected, fetching and rebasing onto latest main..."
            git fetch origin main
            git rebase -X ours origin/main
            sleep $((RANDOM % 5 + 1))
          done
 
          echo "Failed to push after retries."
          exit 1
 
